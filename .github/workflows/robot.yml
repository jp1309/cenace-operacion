name: Robot CENACE

on:
  schedule:
    # Cada 2 horas: CENACE a veces publica varios días seguidos y conviene no perder ninguno.
    # GitHub puede retrasar o saltarse corridas programadas.
    - cron: "17 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "robot/**", "tests/**", ".github/workflows/robot.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: robot-cenace
  cancel-in-progress: false

jobs:
  descargar:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      cambios: ${{ steps.guardar.outputs.cambios }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Pruebas del parser
        run: python -m unittest discover -s tests

      - name: Descargar y actualizar la base
        run: python robot/cenace.py

      - name: Guardar cambios en el repositorio
        id: guardar
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "Sin cambios en los datos."
            echo "cambios=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ultimo=$(python -c 'import json; print(json.load(open("data/meta.json"))["diario"]["hasta"])')
          git config user.name "robot-cenace"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Datos CENACE al ${ultimo}"
          git pull --rebase origin main
          git push
          echo "cambios=true" >> "$GITHUB_OUTPUT"

  publicar:
    needs: descargar
    # Solo se vuelve a publicar si hubo datos nuevos, un cambio en el código o una corrida manual.
    if: >-
      always() && (needs.descargar.result == 'skipped' || (needs.descargar.result == 'success' &&
      (needs.descargar.outputs.cambios == 'true' || github.event_name == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main  # incluye el commit de datos recién hecho

      - name: Armar el sitio
        run: |
          mkdir -p _site/data
          cp site/* _site/
          cp data/*.csv data/meta.json _site/data/
          # Versiona JS y CSS para que el navegador no mezcle archivos de distintos despliegues.
          v="${GITHUB_SHA::7}"
          sed -i "s/\"app\.js\"/\"app.js?v=${v}\"/; s/\"styles\.css\"/\"styles.css?v=${v}\"/" _site/index.html
          grep -o -E '(app\.js|styles\.css)\?v=[0-9a-f]+' _site/index.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: despliegue
        uses: actions/deploy-pages@v5
